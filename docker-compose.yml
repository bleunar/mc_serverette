services:
  crafty:
    container_name: crafty-controller
    image: registry.gitlab.com/crafty-controller/crafty-4:latest
    restart: unless-stopped
    environment:
      - TZ=Asia/Manila
    ports:
      - "8443:8443" # Web UI
      - "25565-25575:25565-25575" # Minecraft Java (TCP)
      - "19132-19142:19132-19142/udp" # Minecraft Bedrock (UDP)
    volumes:
      - ./crafty_data/db:/crafty_db
      - ./crafty_data/web:/crafty_web
      - ./crafty_data/backups:/crafty_backups
      - ./crafty_data/servers:/minecraft_servers
    deploy:
      resources:
        limits:
          memory: 3.5G
