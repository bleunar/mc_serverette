services:
  crafty:
    container_name: crafty-controller
    image: registry.gitlab.com/crafty-controller/crafty-4:latest
    restart: unless-stopped
    environment:
      - TZ=Asia/Manila
    ports:
      # Web UI + Minecraft on the Tailscale IP (TS_IP in .env) and on localhost.
      # Public access goes through playit (below), not open ports.
      - "${TS_IP:?set TS_IP in .env}:8443:8443"
      - "127.0.0.1:8443:8443"
      - "${TS_IP}:25565-25575:25565-25575"
      - "127.0.0.1:25565-25575:25565-25575"
      - "${TS_IP}:19132-19142:19132-19142/udp"
      - "127.0.0.1:19132-19142:19132-19142/udp"
    volumes:
      - ./crafty_data/config:/crafty/app/config
      - ./crafty_data/servers:/crafty/servers
      - ./crafty_data/backups:/crafty/backups
      - ./crafty_data/logs:/crafty/logs
      - ./crafty_data/import:/crafty/import

  # Optional: public access via playit.gg. Start with: docker compose --profile playit up -d
  # In the playit dashboard, point the tunnel at local address `crafty:25565`.
  playit:
    image: ghcr.io/playit-cloud/playit-agent:0.15
    profiles: [playit]
    restart: unless-stopped
    environment:
      - SECRET_KEY=${PLAYIT_SECRET}
    depends_on: [crafty]
